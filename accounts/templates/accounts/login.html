{% extends "base.html" %}
{% block title %}Вхід{% endblock %}
{% block content %}
<div class="auth-card form-card">
    <p class="eyebrow">З поверненням</p>
    <h1>Вхід</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn">Увійти</button>
    </form>
</div>
<p class="auth-alt">Немає акаунта? <a href="{% url 'accounts:register' %}">Зареєструйтесь</a></p>
{% endblock %}
