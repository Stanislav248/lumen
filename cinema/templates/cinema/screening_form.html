{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="auth-card form-card" style="max-width: 640px">
    <p class="eyebrow">Керування афішею</p>
    <h1>{{ title }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="form-actions">
            <button type="submit" class="btn">Зберегти</button>
            <a class="btn btn-ghost" href="{% url 'cinema:screening_list' %}">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
